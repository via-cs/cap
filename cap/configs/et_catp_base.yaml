# Data Configuration
data:
  path: "dataset/ElectricityTransformer/ETTh1.csv"
  batch_size: 32
  train_size: 0.8
  valid_size: 0.1
  test_size: 0.1
  normalization: true
  seq_len: 96
  pred_len: 96

# Model Configuration
models:
  # Manager Model
  manager:
    d_model: 512
    n_heads: 8
    d_ff: 2048
    num_layers: 2
    dropout: 0.05

  # Worker Models - based on quick_catp_test.py
  workers:
    # - name: "LSTM-High"
    #   type: "lstm"
    #   hidden_dim: 128
    #   num_layers: 3
    #   dropout: 0.1
    #   count: 2
      
    # - name: "LSTM-Low"
    #   type: "lstm"
    #   hidden_dim: 64
    #   num_layers: 2
    #   dropout: 0.1
    #   count: 10
      
    # - name: "Transformer"
    #   type: "transformer"
    #   hidden_dim: 512
    #   num_layers: 2
    #   dropout: 0.05
    #   count: 3
      
    # - name: "Autoformer"
    #   type: "autoformer"
    #   hidden_dim: 512
    #   num_layers: 2
    #   dropout: 0.05
    #   count: 3
      
    # - name: "FEDFormer"
    #   type: "fedformer"
    #   hidden_dim: 512
    #   num_layers: 2
    #   dropout: 0.05
    #   # count: 3
      
    - name: "Informer"
      type: "informer"
      hidden_dim: 512
      num_layers: 2
      dropout: 0.05
      count: 3
      
    # - name: "TimesNet"
    #   type: "timesnet"
    #   hidden_dim: 16
    #   num_layers: 2
    #   dropout: 0.05
    #   count: 3

# Training Configuration
training:
  epochs: 30
  manager_lr: 0.0001
  worker_lr: 0.0001
  clip_value: 1.0
  patience: 5
  worker_update_steps: 2
  pre_training_epochs: 0
  
# Logging Configuration
logging:
  log_dir: "runs/et_training_multi_gpu"
  checkpoint_dir: "saved_models/et_training_multi_gpu"
  plot_metrics: false

# Hardware Configuration
hardware:
  device: "auto"  # "auto", "cuda", "cpu"
  multi_gpu: true  # Enable multi-GPU training

# Experiment Configuration
experiment:
  name: "et_catp_training_multi_gpu"
  description: "CATP training on Electricity Transformer dataset with multi-GPU support" 