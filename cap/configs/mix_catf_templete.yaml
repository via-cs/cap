# Data Configuration
data:
  path: "dataset/long_term_forecast/ETT-small/ETTh1.csv"
  batch_size: 32
  train_size: 0.8
  valid_size: 0.1
  test_size: 0.1
  normalization: true
  seq_len: 96
  pred_len: 96

# Model Configuration
models:
  # Manager Model
  manager:
    d_model: 512
    n_heads: 8
    d_ff: 2048
    num_layers: 2
    dropout: 0.05

  # Worker Models - based on quick_catf_test.py
  workers:
      
    # - name: "Transformer"
    #   type: "transformer"
    #   hidden_dim: 512
    #   num_layers: 2
    #   dropout: 0.05
    #   count: 1
      
    - name: "Autoformer"
      type: "autoformer"
      hidden_dim: 512
      num_layers: 2
      dropout: 0.05
      count: 1
      
    - name: "FEDFormer"
      type: "fedformer"
      hidden_dim: 512
      num_layers: 2
      dropout: 0.05
      # count: 1
      
    - name: "Informer"
      type: "informer"
      hidden_dim: 512
      num_layers: 2
      dropout: 0.05
      count: 1
      
    - name: "TimesNet"
      type: "timesnet"
      hidden_dim: 16
      num_layers: 2
      dropout: 0.05
      count: 1

# Training Configuration
training:
  epochs: 30
  manager_lr: 0.00001
  worker_lr: 0.0001
  clip_value: 1.0
  patience: 5
  worker_update_steps: 2
  pre_training_epochs: 0
  
# Logging Configuration
logging:
  log_dir: "runs/et_training"
  checkpoint_dir: "saved_models/et_training"
  plot_metrics: false

# Hardware Configuration
hardware:
  device: "auto"  # "auto", "cuda", "cpu"
  multi_gpu: true  # Enable multi-GPU training

# Experiment Configuration
experiment:
  name: "et_catf_trainig_mix_of_workers"
  description: "CATF training mixture of workers on ETTh1 dataset" 