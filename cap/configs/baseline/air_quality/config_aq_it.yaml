dataset:
  path: "dataset/long_term_forecast/air_quality/Aotizhongxin.csv"
  batch_size: 32
  train_size: 0.8
  valid_size: 0.1
  test_size: 0.1
  normalization: true

model:
  type: "itransformer"
  d_model: 512
  seq_len: 96
  pred_len: 24
  num_layers: 2
  dropout: 0.1
  n_heads: 8
  d_ff: 512
  factor: 3
  embed: "fixed"
  freq: "h"
  activation: "gelu"

training:
  epochs: 10
  learning_rate: 0.0001
  patience: 3
  device: "cuda"
  loss_feature_idx: 0  # compute loss on PM2.5 only (index 0)
