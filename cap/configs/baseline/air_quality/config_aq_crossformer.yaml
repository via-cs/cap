dataset:
  path: "dataset/long_term_forecast/air_quality/Aotizhongxin.csv"
  batch_size: 32
  # -- original 80/10/10 split --
  # train_size: 0.8
  # valid_size: 0.1
  # test_size: 0.1
  # -- ProtoLLM-matching 70/10/20 split --
  train_size: 0.7
  valid_size: 0.1
  test_size: 0.2
  normalization: true

model:
  type: "crossformer"
  d_model: 32
  seq_len: 96
  pred_len: 24
  num_layers: 2
  dropout: 0.1
  d_ff: 64

training:
  epochs: 10
  learning_rate: 0.0001
  patience: 3
  device: "cuda"
  loss_feature_idx: 0  # compute loss on PM2.5 only (index 0)
