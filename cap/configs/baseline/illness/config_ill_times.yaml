dataset:
  path: "dataset/long_term_forecast/illness/national_illness.csv"
  batch_size: 32
  train_size: 0.8
  valid_size: 0.1
  test_size: 0.1
  normalization: true

model:

  type: "timesnet"
  d_model: 768
  seq_len: 36
  pred_len: 36
  num_layers: 2
  dropout: 0.1
  d_ff: 768

training:
  epochs: 10
  learning_rate: 0.0001
  patience: 3
  device: "cuda"
